# 로컬 데모용 엣지 프록시. 가중치는 Runtime API(포트 9999)로 바꾼다: scripts/weight.sh
global
  log stdout format raw local0
  stats socket ipv4@0.0.0.0:9999 level admin

defaults
  mode http
  log global
  option httplog
  timeout connect 3s
  timeout http-request 10s
  # SSE 연결은 오래 유지되므로 넉넉하게 잡는다
  timeout client 1h
  timeout server 1h
  # 내려가는 인스턴스가 503을 주거나 연결이 실패하면 다른 인스턴스로 다시 보낸다
  retries 3
  retry-on conn-failure empty-response 503
  option redispatch 1

frontend web
  bind :8080
  default_backend app

backend app
  balance roundrobin
  option httpchk GET /healthz
  http-check expect status 200
  default-server inter 1s fall 2 rise 2
  server app-a app-a:8080 check weight 100
  server app-b app-b:8080 check weight 0

frontend stats
  bind :8404
  stats enable
  stats uri /
  stats refresh 2s
