apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  annotations: {}
  name: chat-app-egress
  namespace: chat-source
spec:
  egress:
  - ports:
    - port: 5432
      protocol: TCP
    to:
    - podSelector:
        matchLabels:
          app: chat-db
  # 이전 플랫폼이 둔 PgBouncer(cmp-cutover). DB 전환 때 앱 연결이 이 주소로 바뀐다.
  - ports:
    - port: 6432
      protocol: TCP
    to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: cmp-cutover
  # 플랫폼(데모 서버) OTLP 수신(HTTPS). 트레이스·메트릭만 보낸다
  - ports:
    - port: 443
      protocol: TCP
    to:
    - ipBlock:
        cidr: 13.209.240.49/32
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
  podSelector:
    matchLabels:
      app: chat-app
  policyTypes:
  - Egress
