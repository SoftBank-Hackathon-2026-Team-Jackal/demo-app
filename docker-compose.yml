# 개발용: Postgres 하나에 앱을 바로 붙인다. 이전 리허설 환경은 Finals 저장소의 poc/demo를 쓴다.
#   docker compose up -d --build   →  http://localhost:8080
services:
  db:
    image: postgres:16
    # db_node 표시용 노드 이름. 실제 환경에서는 DB 운영 쪽에서 서버마다 설정한다
    command: ["postgres", "-c", "app.node_name=pg-dev"]
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 2s
      retries: 30

  app:
    build: .
    # 종료 시 DRAIN_DELAY(3초) + 진행 중인 요청 정리 시간을 보장한다
    stop_grace_period: 20s
    depends_on:
      db: { condition: service_healthy }
    environment:
      ENV_NAME: dev
      DATABASE_URL: postgresql://postgres:postgres@db:5432/app
      # OpenTelemetry: 비우면 내보내지 않는다. 트레이스는 Jaeger(http://localhost:16686), 메트릭은 collector 로그
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_METRIC_EXPORT_INTERVAL: "5000"
    ports:
      - "8080:8080"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel/collector-dev.yaml:/etc/otelcol/config.yaml:ro

  jaeger:
    image: jaegertracing/all-in-one:1.66.0
    ports:
      - "16686:16686"
